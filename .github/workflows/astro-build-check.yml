name: Astro Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  astro-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify Markdown table and Mermaid output
        run: node --test tests/scrollable-tables.test.js

      - name: Verify giscus comments markup
        run: node --test tests/giscus-comments.test.js

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          node -e "const fs = require('fs'); const html = fs.readFileSync('dist/index.html', 'utf8'); if (!html.includes('Calvin Xia')) { throw new Error('dist/index.html is missing the home page brand title'); }"
          node -e "const fs = require('fs'); const headers = fs.readFileSync('dist/_headers', 'utf8'); if (!headers.includes('X-Content-Type-Options: nosniff')) { throw new Error('dist/_headers is missing security headers'); }"

      - name: Verify social meta and OG cards
        run: |
          node -e "const fs = require('fs'); const home = fs.readFileSync('dist/index.html', 'utf8'); for (const needle of ['property=\"og:title\"', 'property=\"og:image\"', 'rel=\"canonical\"', 'application/ld+json']) { if (!home.includes(needle)) { throw new Error('dist/index.html is missing ' + needle); } }"
          node -e "const fs = require('fs'); const article = fs.readFileSync('dist/articles/20260411-ai-reliance/index.html', 'utf8'); for (const needle of ['\"@type\":\"BlogPosting\"', 'article:published_time', 'og:image']) { if (!article.includes(needle)) { throw new Error('article page is missing ' + needle); } }"
          test -f dist/og/default.png
          node --input-type=module -e "
          import { readdirSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';
          import matter from 'gray-matter';
          import { listPostFiles } from './scripts/blog-posts.js';
          const files = await listPostFiles('src/content/blog');
          let titled = 0;
          for (const file of files) {
              const data = matter(await readFile(file, 'utf8')).data || {};
              if (String(data.title || '').trim()) titled += 1;
          }
          const cards = readdirSync('dist/og').filter((name) => name.endsWith('.png')).length;
          if (cards !== titled + 1) {
              throw new Error('OG card count mismatch: expected ' + (titled + 1) + ' (titled posts + default), found ' + cards);
          }
          console.log('OG card check ok: ' + cards + ' cards = ' + titled + ' posts + default');
          "
          node -e "const fs = require('fs'); const rss = fs.readFileSync('dist/rss.xml', 'utf8'); if (!rss.includes('content:encoded') || rss.length < 20000) { throw new Error('dist/rss.xml is missing full-text content:encoded entries'); }"
          node -e "const fs = require('fs'); if (fs.existsSync('dist/articles/00010101-test-assignment')) { throw new Error('dist must not contain the removed test article route'); }"
