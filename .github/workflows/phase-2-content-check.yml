name: Phase 2 Content Check

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - scripts/**
      - tests/**
      - tools/**
      - eslint.config.js
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/phase-2-content-check.yml
  pull_request:
    paths:
      - src/**
      - public/**
      - scripts/**
      - tests/**
      - tools/**
      - eslint.config.js
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/phase-2-content-check.yml

jobs:
  validate-content-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run file operation tests with coverage
        run: npm run test:coverage

      - name: Validate content structure
        run: |
          test -f src/content.config.ts
          test -f src/content/blog/20260411-ai-reliance.md
          test -f src/content/updates/fingerprint-app-update-log.json

      - name: Run content check
        run: npm run check
        # 全量构建及 build 产物断言只在 astro-build-check.yml 跑一次，本 workflow 不再重复 npm run build。
